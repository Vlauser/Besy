# Временный http-конфиг: только чтобы Let's Encrypt смог пройти проверку.
#
# Полный deploy/nginx.conf ссылается на файлы сертификата, которых до
# первого выпуска не существует, и `nginx -t` на нём падает. Поэтому
# сначала поднимаем этот, выпускаем сертификат, затем ставим полный.

server {
    listen 80;
    listen [::]:80;
    server_name treffit.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'treffit: ожидается выпуск сертификата\n';
        add_header Content-Type text/plain;
    }
}
