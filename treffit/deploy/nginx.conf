# Treffit — nginx site config.
#
# Install to /etc/nginx/sites-available/treffit, symlink into sites-enabled,
# then run certbot (see docs/deploy.md) which fills in the TLS block.
#
# Telegram only loads a Mini App over https with a valid certificate, and
# only sends webhooks to https — plain http is a dead end here.

server {
    listen 80;
    listen [::]:80;
    server_name treffit.example.com;

    # Everything except the ACME challenge goes to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Отдельная директива `http2 on;` появилась только в nginx 1.25.
    # На 1.18 (Ubuntu 20.04) работает форма внутри listen, и её же
    # понимают новые версии — так конфиг остаётся переносимым.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name treffit.example.com;

    ssl_certificate     /etc/letsencrypt/live/treffit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treffit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The Mini App is loaded inside Telegram's webview, so framing must stay
    # allowed — do NOT add X-Frame-Options: DENY here.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built frontend: `npm run build`, then copy dist/ here.
    root /srv/treffit/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    # Hashed asset filenames are immutable; index.html must never be cached
    # or users keep booting an old bundle against a new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # Required for /api/ws to upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets idle between messages; the default 60s would cut them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
