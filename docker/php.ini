; Настройки сверх базовых. Файл кладётся в conf.d, поэтому переопределяет
; только перечисленное, остальное остаётся заводским.

; Загрузка картинок через админку. Движок ограничивает файл 8 МБ сам,
; здесь запас: иначе PHP отрежет загрузку раньше, чем дойдёт до проверки,
; и человек увидит пустую ошибку вместо понятного сообщения.
upload_max_filesize = 12M
post_max_size = 12M

; Сайт небольшой, а памяти на сервере мало — 128 МБ хватает с запасом.
memory_limit = 128M

; Заявка уходит в Telegram в том же запросе. Если сеть тормозит,
; лучше подождать, чем оборвать отправку на середине.
max_execution_time = 60

; Часовой пояс для времени в уведомлениях о заявках.
; Поменяйте на свой, если время приходит неверное.
date.timezone = Europe/Moscow

expose_php = Off
