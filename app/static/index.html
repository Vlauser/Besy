<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Besy — обработка фото деталей</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="login" class="overlay hidden">
  <form id="login-form" class="card login-card">
    <h1>Besy</h1>
    <p class="muted">Введите пароль, чтобы получить доступ к обработке.</p>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit" class="primary">Войти</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<header>
  <div class="brand">
    <span class="logo">B</span>
    <div>
      <h1>Besy</h1>
      <p class="muted" id="tagline">Фото детали → белый фон, деталь по центру</p>
    </div>
  </div>
  <div class="header-meta" id="header-meta"></div>
</header>

<main>
  <section class="card" id="upload-card">
    <div id="dropzone" class="dropzone">
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      <p class="dz-title">Перетащите фото сюда</p>
      <p class="muted">или <button type="button" class="link" id="browse">выберите файлы</button> — JPEG, PNG, WebP</p>
      <p class="muted small" id="limits"></p>
    </div>

    <div id="selection" class="selection hidden">
      <span id="selection-count"></span>
      <button type="button" class="link" id="clear-selection">очистить</button>
    </div>

    <details class="settings">
      <summary>Параметры обработки</summary>
      <div class="grid">
        <label>Ширина холста, px
          <input type="number" id="opt-w" min="200" max="4000" step="1">
        </label>
        <label>Высота холста, px
          <input type="number" id="opt-h" min="200" max="4000" step="1">
        </label>
        <label>Заполнение по высоте
          <input type="number" id="opt-fill" min="0.1" max="1" step="0.01">
          <span class="hint">Доля высоты холста, которую занимает деталь</span>
        </label>
        <label>Максимум по ширине
          <input type="number" id="opt-fillw" min="0.1" max="1" step="0.01">
          <span class="hint">Предохранитель для широких деталей</span>
        </label>
        <label>Качество JPEG
          <input type="number" id="opt-q" min="60" max="100" step="1">
        </label>
        <label>Цвет фона
          <input type="color" id="opt-bg">
        </label>
        <label class="checkbox">
          <input type="checkbox" id="opt-matting">
          <span>Alpha matting — чище край, но в разы медленнее</span>
        </label>
      </div>
    </details>

    <button type="button" id="start" class="primary wide" disabled>Обработать</button>
    <p id="upload-error" class="error hidden"></p>
  </section>

  <section id="job" class="hidden">
    <div class="card job-head">
      <div class="progress-wrap">
        <div class="progress"><div id="progress-bar"></div></div>
        <p id="job-status" class="muted"></p>
      </div>
      <div class="job-actions">
        <button type="button" id="download" class="primary" disabled>Скачать ZIP</button>
        <button type="button" id="cancel" class="ghost">Отменить</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button type="button" class="chip active" data-filter="all">Все</button>
        <button type="button" class="chip" data-filter="issues">Требуют внимания</button>
        <button type="button" class="chip" data-filter="error">Ошибки</button>
      </div>
      <label class="checkbox inline">
        <input type="checkbox" id="show-source">
        <span>Показывать исходники</span>
      </label>
    </div>

    <div id="gallery" class="gallery"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
